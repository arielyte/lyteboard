[package]
name = "lyteboard-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The only crate containing Windows FFI. The application crates forbid unsafe code.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_SystemServices", "Win32_System_SystemInformation", "Win32_UI_Shell", "Win32_System_Com"] }
tokio = { workspace = true, features = ["io-util", "sync"] }
zeroize = "1"

[target.'cfg(windows)'.dev-dependencies]
tempfile = "3"

[package]
name = "lyteboard-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
lyteboard-protocol.workspace = true
snow = { version = "=0.10.0", default-features = false, features = ["use-chacha20poly1305", "use-curve25519", "use-sha2"] }
thiserror.workspace = true
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
zeroize = "1.8"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true, features = ["fs"] }
serde.workspace = true
tokio = { workspace = true, features = ["io-util", "time"] }

[package]
name = "lyteboard-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
sha2 = "0.11"
lyteboard-protocol.workspace = true
snow = { version = "=0.10.0", default-features = false, features = ["use-chacha20poly1305", "use-curve25519", "use-sha2"] }
thiserror.workspace = true
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
zeroize = "1.8"
tokio = { workspace = true, features = ["io-util", "sync", "time"] }

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
rustix = { workspace = true, features = ["event", "fs", "net", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "6.0.0", default-features = false, features = ["rt-default", "crypto-rust"] }
tokio = { workspace = true, features = ["process"] }
wl-clipboard-rs = "0.9.5"
x11rb = { version = "0.14", features = ["xfixes"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
tempfile = "3"

[target.'cfg(any(target_os = "linux", target_os = "android", target_os = "windows"))'.dependencies]
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
lyteboard-windows = { path = "../windows" }
tokio = { workspace = true, features = ["process"] }

[target.'cfg(target_os = "windows")'.dev-dependencies]
tempfile = "3"

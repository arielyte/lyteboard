[package]
name = "lyteboard-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "lyteboardd"
path = "src/main.rs"

[dependencies]
clap.workspace = true
lyteboard-core.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
lyteboard-protocol.workspace = true
mdns-sd = { version = "0.22", default-features = false, features = ["async"] }
getrandom = "0.4.3"
hex = "0.4"
if-addrs = "0.15"
rusqlite = { version = "0.43", default-features = false, features = ["bundled"] }
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
zeroize = "1"

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["io-util"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true, features = ["fs"] }

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Check desktop formatting
        working-directory: apps/desktop
        run: npm run format:check

      - name: Check desktop types
        working-directory: apps/desktop
        run: npm run typecheck

      - name: Lint desktop
        working-directory: apps/desktop
        run: npm run lint

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Lint Rust
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test Rust
        run: cargo test --locked --workspace

      - name: Build Rust workspace
        run: cargo build --locked --workspace

      - name: Build desktop with embedded frontend
        working-directory: apps/desktop
        run: npm run tauri build -- --debug --no-bundle --ci -- --locked
